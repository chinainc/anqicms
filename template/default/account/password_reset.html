{% extends 'base.html' %}

{% block head %}
<link rel="stylesheet" type="text/css" href="{% system with name='TemplateUrl' %}css/member.css" />
{% endblock %}

{% block container %}
<div class="auth-wrap">
    <div class="auth-card">
        <h1 class="auth-title">{% tr 'ResetPassword' %}</h1>
        <p class="auth-sub">{{ email }}</p>

        <form id="reset-form" autocomplete="off">
            <input type="hidden" name="email" value="{{ email }}">
            <input type="hidden" name="token" value="{{ token }}">
            <input type="hidden" name="code" value="{{ code }}">
            <div class="auth-field">
                <i class="fa fa-lock"></i>
                <input type="password" name="password" placeholder="{% tr 'NewPassword' %}" autocomplete="new-password">
            </div>
            <div class="auth-field">
                <i class="fa fa-lock"></i>
                <input type="password" name="confirm_password" placeholder="{% tr 'ConfirmPassword' %}" autocomplete="new-password">
            </div>
            <button type="submit" class="member-btn auth-submit">{% tr 'ResetPassword' %}</button>
            <div class="auth-foot">
                <a class="auth-link" href="/login">{% tr 'BackToLogin' %}</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block bottom %}
<script src="{% system with name='TemplateUrl' %}js/member.js" type="text/javascript"></script>
<script>
    (function () {
        var form = document.getElementById('reset-form');
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            var password = form.querySelector('[name="password"]').value.trim();
            var confirmPassword = form.querySelector('[name="confirm_password"]').value.trim();
            if (password.length < 6) {
                Member.toast(MEMBER_I18N.passwordTooShort);
                return;
            }
            if (password !== confirmPassword) {
                Member.toast(MEMBER_I18N.passwordsNotMatch);
                return;
            }
            Member.request('/api/password/reset', {
                body: {
                    email: form.querySelector('[name="email"]').value,
                    token: form.querySelector('[name="token"]').value,
                    code: form.querySelector('[name="code"]').value,
                    password: password
                }
            }).then(function () {
                Member.toast(MEMBER_I18N.resetPasswordSuccess);
                setTimeout(function () { location.href = '/login'; }, 1200);
            }).catch(Member.errorToast);
        });
    })();
</script>
{% endblock %}
