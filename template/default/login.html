{% extends 'base.html' %}

{% block head %}
<link rel="stylesheet" type="text/css" href="{% system with name='TemplateUrl' %}css/member.css" />
{% endblock %}

{% block container %}
<div class="auth-wrap">
    <div class="auth-card">
        <h1 class="auth-title">{% tr 'Login' %}</h1>
        <p class="auth-sub">{% tr 'WelcomeBack' %}</p>

        <form id="login-form" autocomplete="off">
            <input type="hidden" name="redirect" value="{{ redirect }}">
            <div class="auth-field">
                <i class="fa fa-user-o"></i>
                <input type="text" name="user_name" placeholder="{% tr 'AccountPlaceholder' %}" autocomplete="username">
            </div>
            <div class="auth-field">
                <i class="fa fa-lock"></i>
                <input type="password" name="password" placeholder="{% tr 'PasswordPlaceholder' %}" autocomplete="current-password">
            </div>
            <div class="auth-field auth-field--captcha" id="captcha-row" hidden>
                <i class="fa fa-shield"></i>
                <input type="text" name="captcha" placeholder="{% tr 'Captcha' %}" autocomplete="off">
                <img class="auth-captcha" id="captcha-img" alt="{% tr 'Captcha' %}">
            </div>
            <div class="auth-row">
                <label class="auth-check">
                    <input type="checkbox" name="remember"> {% tr 'RememberMe' %}
                </label>
                <a class="auth-link" href="/forget">{% tr 'ForgotPassword' %}</a>
            </div>
            <button type="submit" class="member-btn auth-submit">{% tr 'Login' %}</button>
            <div class="auth-foot">
                <span>{% tr 'NoAccountYet' %}</span>
                <a class="auth-link" href="/register">{% tr 'RegisterNow' %}</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block bottom %}
<script src="{% system with name='TemplateUrl' %}js/member.js" type="text/javascript"></script>
<script>
    (function () {
        var form = document.getElementById('login-form');
        var captchaRow = document.getElementById('captcha-row');
        var captchaImg = document.getElementById('captcha-img');
        var captchaId = '';

        function loadCaptcha() {
            Member.get('/api/captcha').then(function (res) {
                if (res.data && res.data.captcha_off) {
                    captchaRow.hidden = true;
                    captchaId = '';
                    return;
                }
                captchaRow.hidden = false;
                captchaId = res.data.captcha_id;
                captchaImg.src = res.data.captcha;
            }).catch(function () {
                captchaRow.hidden = true;
            });
        }

        captchaImg.addEventListener('click', loadCaptcha);
        loadCaptcha();

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            var userName = form.querySelector('[name="user_name"]').value.trim();
            var password = form.querySelector('[name="password"]').value.trim();
            if (userName === '' || password === '') {
                Member.toast(MEMBER_I18N.enterAccountAndPassword);
                return;
            }
            var payload = {
                user_name: userName,
                password: password,
                remember: form.querySelector('[name="remember"]').checked
            };
            if (captchaId !== '') {
                payload.captcha_id = captchaId;
                payload.captcha = form.querySelector('[name="captcha"]').value.trim();
            }
            Member.request('/api/login', { body: payload }).then(function () {
                var redirect = form.querySelector('[name="redirect"]').value;
                if (redirect.indexOf('/') === 0) {
                    location.href = redirect;
                } else {
                    location.href = '/member';
                }
            }).catch(function (err) {
                Member.errorToast(err);
                if (captchaId !== '') {
                    loadCaptcha();
                    form.querySelector('[name="captcha"]').value = '';
                }
            });
        });
    })();
</script>
{% endblock %}
