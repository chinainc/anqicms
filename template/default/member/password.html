{% extends 'member/layout.html' %}

{% block member_title %}{% tr 'ChangePassword' %}{% endblock %}

{% block member %}
<form class="member-form" id="password-form" autocomplete="off">
    <div class="member-panel">
        <div class="member-panel__head">
            <h3>{% tr 'ChangePassword' %}</h3>
        </div>
        <div class="member-fields member-fields--narrow">
            <div class="member-field">
                <label>{% tr 'OldPassword' %}</label>
                <input type="password" name="old_password" placeholder="{% tr 'OldPassword' %}" autocomplete="current-password">
            </div>
            <div class="member-field">
                <label>{% tr 'NewPassword' %}</label>
                <input type="password" name="password" placeholder="{% tr 'NewPassword' %}" autocomplete="new-password">
            </div>
            <div class="member-field">
                <label>{% tr 'ConfirmPassword' %}</label>
                <input type="password" name="confirm_password" placeholder="{% tr 'ConfirmPassword' %}" autocomplete="new-password">
            </div>
        </div>
        <p class="member-form__tip">{% tr 'PasswordLengthTip' %}</p>
        <div class="member-form__actions">
            <button type="submit" class="member-btn">{% tr 'Submit' %}</button>
        </div>
    </div>
</form>
{% endblock %}

{% block member_script %}
<script>
    (function () {
        var form = document.getElementById('password-form');
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            var oldPassword = form.querySelector('[name="old_password"]').value.trim();
            var password = form.querySelector('[name="password"]').value.trim();
            var confirmPassword = form.querySelector('[name="confirm_password"]').value.trim();

            if (password.length < 6) {
                Member.toast(MEMBER_I18N.passwordTooShort);
                return;
            }
            if (password !== confirmPassword) {
                Member.toast(MEMBER_I18N.passwordsNotMatch);
                return;
            }

            var payload = { password: password };
            if (oldPassword !== '') {
                payload.old_password = oldPassword;
            }
            Member.request('/api/user/password', { body: payload }).then(function () {
                Member.toast(MEMBER_I18N.saveSuccess);
                form.reset();
            }).catch(Member.errorToast);
        });
    })();
</script>
{% endblock %}
